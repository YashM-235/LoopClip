
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoopClip</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="app">
        <header class="header">
            <div>
                <h1>LoopClip</h1>
                <p class="tagline">Replay the part that matters.</p>
            </div>
            <span class="version">v0.5.0</span>
        </header>

        <section class="panel">
            <h2>Video Loop</h2>
            <p id="videoStatus" class="status">Checking video...</p>

            <div class="field-row">
                <label class="field">
                    <span>Start (seconds)</span>
                    <input id="startTime" type="number" min="0" step="0.1" value="0">
                    <button id="setStartNow" class="secondary" type="button">
                        Set to current time
                    </button>
                </label>

                <label class="field">
                    <span>End (seconds)</span>
                    <input id="endTime" type="number" min="0" step="0.1" value="10">
                    <button id="setEndNow" class="secondary" type="button">
                        Set to current time
                    </button>
                </label>
            </div>

            <label class="field">
                <span>Repetitions</span>
                <input id="repeatCount" type="number" min="1" step="1" value="3">
            </label>

            <label class="checkbox-row">
                <input id="infiniteLoop" type="checkbox" checked>
                <span>Loop indefinitely</span>
            </label>

            <label class="field">
                <span>Playback speed</span>
                <select id="speedSelect">
                    <option value="0.5">0.5×</option>
                    <option value="0.75">0.75×</option>
                    <option value="1" selected>1.00×</option>
                    <option value="1.25">1.25×</option>
                    <option value="1.5">1.50×</option>
                    <option value="1.75">1.75×</option>
                    <option value="2">2.00×</option>
                    <option value="2.5">2.50×</option>
                    <option value="3">3.00×</option>
                    <option value="4">4.00×</option>
                </select>
            </label>

            <div class="button-row">
                <button id="startLoop" class="primary" type="button">
                    Start Loop
                </button>
                <button id="stopLoop" class="danger" type="button">
                    Stop Loop
                </button>
            </div>

            <p id="loopStatus" class="status" role="status"></p>
        </section>

        <section class="panel notes-panel">
            <h2>Timestamp Notes</h2>
            <p class="hint">
                Save useful ideas and return to their exact video timestamps.
            </p>

            <label class="field">
                <span>Your note</span>
                <textarea
                    id="noteText"
                    rows="3"
                    maxlength="2000"
                    placeholder="Write a key takeaway, formula, or reminder..."
                ></textarea>
            </label>

            <div class="button-row">
                <button id="saveNoteBtn" class="primary" type="button">
                    Save at Current Time
                </button>
                <button id="cancelEditBtn" class="secondary hidden" type="button">
                    Cancel Edit
                </button>
            </div>

            <p id="notesStatus" class="status" role="status"></p>
            <div id="notesList" class="notes-list">
                <p class="empty-state">No notes saved for this page yet.</p>
            </div>
        </section>

        <footer>
            <p>Notes are stored locally in your browser.</p>
        </footer>
    </main>

    <script src="popup.js"></script>
</body>
</html>
